{% load i18n wagtailcore_tags wagtailimages_tags %}
{% load widget_tweaks %}
{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{% block title %}SmartQuail-IT Cloud Business{% endblock %}</title>
<meta name="description" content="{% block meta_description %}El futuro digital de tu empresa comienza aquí con soluciones de IA, automatización y cloud business en Ecuador.{% endblock %}">
<link rel="canonical" href="{{ request.build_absolute_uri }}" />
<link rel="shortcut icon" href="{% static 'img/logo_red.png' %}">
<link rel="stylesheet" href="{% static 'web_assets/css/master.css' %}">
<link rel="stylesheet" href="{% static 'web_assets/css/responsive.css' %}">
<link rel="stylesheet" href="{% static 'web_assets/css/audio.css' %}">
<link rel="stylesheet" href="{% static 'web_assets/icofont/icofont.min.css' %}">

<!--=== SmartQuail GEO / LLMO Schema.org Data ===-->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://ec.smartquail.io/#organization",
        "name": "SmartQuail",
        "legalName": "SmartQuail S.A.S.",
        "url": "https://ec.smartquail.io/",
        "logo": "https://ec.smartquail.io/static/web_assets/images/smartquail_isologo_white.png",
        "image": "https://ec.smartquail.io/static/web_assets/images/smartquail_ini.png",
        "description": "Proveedor líder de soluciones Cloud Business, infraestructura privada de Inteligencia Artificial, ERP, CRM y sistemas de alta disponibilidad en nube nativa en Ecuador.",
        "foundingLocation": {
          "@type": "Place",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Quito",
            "addressCountry": "EC"
          }
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Quito",
          "addressCountry": "EC"
        },
        "sameAs": [
          "https://www.linkedin.com/smartquail"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://ec.smartquail.io/#website",
        "url": "https://ec.smartquail.io/",
        "name": "SmartQuail IT Cloud Business",
        "publisher": {
          "@id": "https://ec.smartquail.io/#organization"
        },
        "inLanguage": "es"
      },
      {
        "@type": "SoftwareApplication",
        "name": "SmartBusinessPlatforms",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Cloud-native, Web",
        "offers": {
          "@type": "Offer",
          "price": "800",
          "priceCurrency": "USD"
        },
        "description": "Plataformas all in one de negocio que integran ERP, CRM, comercio electrónico, gestión médica, educativa y administrativa en la nube."
      }
    ]
  }
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://ec.smartquail.io/cto/#author",
      "name": "Santiago Silva",
      "jobTitle": "Chief Technology Officer & Founder",
      "worksFor": {
        "@type": "Organization",
        "name": "SmartQuail",
        "url": "https://ec.smartquail.io/"
      },
      "url": "https://ec.smartquail.io/cto/",
      "knowsAbout": [
        "Cloud Native Infrastructure",
        "Private Artificial Intelligence",
        "Kubernetes & SRE",
        "Software Architecture",
        "ERP and CRM Systems"
      ],
      "sameAs": [
        "https://www.linkedin.com/santiagosilva"
      ]
    }
    </script>

</head>

<body>

<!--=== Loader Start ======-->
<div id="loader-overlay">
  <div class="loader-wrapper">
    <div class="scoda-pulse"></div>
  </div>
</div>
<!--=== Loader End ======-->

<!--=== Wrapper Start ===-->
<div class="wrapper" id="main">

  {% block content %}
  {% endblock %}


  <!--=== GO TO TOP  ===-->
  <a href="index.html#" id="back-to-top" title="Back to top">&uarr;</a>
  <!--=== GO TO TOP End ===-->

</div>
<!--=== Wrapper End ===-->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB1eO-IAC9PhPE5APzZDSs8W40ewuxnsu8"></script>
<!--=== Javascript Plugins ===-->
<script src="{% static 'web_assets/js/jquery.min.js' %}"></script>
<script src="{% static 'web_assets/js/validator.js' %}"></script>
<script src="{% static 'web_assets/js/plugins.js' %}"></script>
<script src="{% static 'web_assets/js/master.js' %}"></script>
<script src="{% static 'web_assets/js/bootsnav.js' %}"></script>
<!--=== Javascript Plugins End ===-->

<script>
  window.onload = function() {
    document.getElementById("main").classList.add("loaded")

    lax.setup()

    const update = () => {
      lax.update(window.scrollY)
      window.requestAnimationFrame(update)
    }

    window.requestAnimationFrame(update)

    let w = window.innerWidth
    window.addEventListener("resize", function() {
      if(w !== window.innerWidth) {
        lax.updateElements()
      }
    });
  }
</script>

</body>
</html>
